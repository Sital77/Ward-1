<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>🔧 Firebase Auth & Firestore Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        h1 { color: #38bdf8; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
        .card h2 { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
        .result { padding: 8px 12px; border-radius: 6px; margin: 4px 0; font-family: 'Consolas', monospace; font-size: 0.85rem; }
        .pass { background: #064e3b; color: #6ee7b7; }
        .fail { background: #7f1d1d; color: #fca5a5; }
        .info { background: #1e3a5f; color: #93c5fd; }
        .warn { background: #78350f; color: #fcd34d; }
        button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin: 4px; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        #log { max-height: 600px; overflow-y: auto; }
        .step-num { color: #f59e0b; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔧 Firebase Auth & Firestore Write Debug Tool</h1>
    
    <div class="card">
        <h2>Step 1: Check Firebase Auth State</h2>
        <button class="btn-primary" onclick="checkAuthState()">Check Current Auth State</button>
        <div id="authResult"></div>
    </div>

    <div class="card">
        <h2>Step 2: Check if Anonymous Auth is Enabled</h2>
        <button class="btn-primary" onclick="testAnonAuth()">Test Anonymous Login</button>
        <div id="anonResult"></div>
    </div>

    <div class="card">
        <h2>Step 3: Test Email/Password Credentials</h2>
        <button class="btn-primary" onclick="testAllCredentials()">Test ALL Fallback Credentials</button>
        <div id="credResult"></div>
    </div>

    <div class="card">
        <h2>Step 4: Test Firestore Write (with current auth)</h2>
        <button class="btn-primary" onclick="testFirestoreWrite()">Test Write to Firestore</button>
        <button class="btn-danger" onclick="cleanupTest()">Delete Test Doc</button>
        <div id="writeResult"></div>
    </div>

    <div class="card">
        <h2>Step 5: Full Diagnosis</h2>
        <button class="btn-primary" onclick="fullDiagnosis()">Run Full Diagnosis</button>
        <div id="fullResult"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC3uCmLgNN8s0FDMIrkgxR8eH_AvJ_D3J4",
            authDomain: "gauradaha-ward1.firebaseapp.com",
            projectId: "gauradaha-ward1",
            storageBucket: "gauradaha-ward1.firebasestorage.app",
            messagingSenderId: "905617778132",
            appId: "1:905617778132:web:b8149cf37ae3f3c3b42241"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let testDocId = null;

        function log(containerId, msg, type) {
            const el = document.getElementById(containerId);
            el.innerHTML += `<div class="result ${type}">${msg}</div>`;
        }

        function clear(containerId) {
            document.getElementById(containerId).innerHTML = '';
        }

        // Step 1
        function checkAuthState() {
            clear('authResult');
            const user = firebase.auth().currentUser;
            if (user) {
                log('authResult', `✅ LOGGED IN: email=${user.email || 'N/A'}, uid=${user.uid}, isAnonymous=${user.isAnonymous}`, 'pass');
            } else {
                log('authResult', `❌ NOT LOGGED IN: firebase.auth().currentUser is NULL`, 'fail');
                log('authResult', `ℹ️ This means Firestore writes WILL FAIL because your rules require request.auth != null`, 'warn');
            }

            // Also check localStorage session
            const session = localStorage.getItem('sifarish_session');
            const authFlag = localStorage.getItem('sifarish_auth');
            log('authResult', `ℹ️ localStorage sifarish_auth = "${authFlag}"`, 'info');
            log('authResult', `ℹ️ localStorage sifarish_session = ${session ? 'EXISTS' : 'NULL'}`, 'info');

            // Listen for auth changes
            firebase.auth().onAuthStateChanged(u => {
                if (u) {
                    log('authResult', `🔄 onAuthStateChanged fired: user=${u.email || 'anonymous'}, uid=${u.uid}`, 'pass');
                } else {
                    log('authResult', `🔄 onAuthStateChanged fired: NO USER`, 'warn');
                }
            });
        }

        // Step 2
        async function testAnonAuth() {
            clear('anonResult');
            log('anonResult', '⏳ Testing signInAnonymously()...', 'info');
            try {
                const cred = await firebase.auth().signInAnonymously();
                log('anonResult', `✅ Anonymous Auth WORKS! uid=${cred.user.uid}`, 'pass');
                // Sign out so we don't pollute other tests
                await firebase.auth().signOut();
                log('anonResult', `ℹ️ Signed out after test`, 'info');
            } catch (e) {
                log('anonResult', `❌ Anonymous Auth FAILED: code=${e.code}, message=${e.message}`, 'fail');
                if (e.code === 'auth/admin-restricted-operation' || e.code === 'auth/operation-not-allowed') {
                    log('anonResult', `⚠️ Anonymous Sign-in is DISABLED in Firebase Console! Go to Firebase Console → Authentication → Sign-in method → Anonymous → Enable`, 'warn');
                }
            }
        }

        // Step 3
        async function testAllCredentials() {
            clear('credResult');
            const creds = [
                { e: 'ward1@gauradaha.gov.np', p: 'wada1' },
                { e: 'ward1@gauradaha.gov.np', p: 'ward1' },
                { e: 'ward1@gauradaha.gov.np', p: 'ward1wada1' },
                { e: 'ward1@gauradaha.gov.np', p: '123456' },
                { e: 'admin@gauradaha.gov.np', p: 'admin' },
                { e: 'admin@gauradaha.gov.np', p: 'admin123' },
                { e: 'gauradaha.ward1@gmail.com', p: 'ward1wada1' },
                { e: 'gauradaha.ward1@gmail.com', p: 'wada1' },
                { e: 'ward3@gauradaha.gov.np', p: 'wada3' },
                { e: 'wada1@gauradaha.gov.np', p: 'wada1' }
            ];

            let anyWorked = false;
            for (const c of creds) {
                log('credResult', `⏳ Testing ${c.e} / ${c.p} ...`, 'info');
                try {
                    const cred = await firebase.auth().signInWithEmailAndPassword(c.e, c.p);
                    log('credResult', `✅ SUCCESS: ${c.e} / ${c.p} → uid=${cred.user.uid}`, 'pass');
                    anyWorked = true;
                    // Don't sign out — keep this successful login
                    break;
                } catch (e) {
                    let reason = e.code;
                    if (e.code === 'auth/user-not-found') reason = 'USER NOT FOUND (not registered in Firebase)';
                    else if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') reason = 'WRONG PASSWORD or INVALID CREDENTIAL';
                    else if (e.code === 'auth/invalid-email') reason = 'INVALID EMAIL FORMAT';
                    else if (e.code === 'auth/too-many-requests') reason = 'TOO MANY ATTEMPTS (temporarily blocked)';
                    log('credResult', `❌ FAILED: ${c.e} / ${c.p} → ${reason}`, 'fail');
                }
            }

            if (!anyWorked) {
                log('credResult', `\n⚠️⚠️⚠️ NONE of the fallback credentials worked! This is WHY saves fail!`, 'warn');
                log('credResult', `FIX: You need to create a user in Firebase Console → Authentication → Users → Add User`, 'warn');
                log('credResult', `Recommended: Create user with email "ward1@gauradaha.gov.np" and password "wada1"`, 'warn');
            }
        }

        // Step 4
        async function testFirestoreWrite() {
            clear('writeResult');
            const user = firebase.auth().currentUser;
            log('writeResult', `ℹ️ Current auth user: ${user ? (user.email || 'anonymous:' + user.uid) : 'NULL (not logged in)'}`, user ? 'pass' : 'warn');

            log('writeResult', '⏳ Attempting to write test document to Firestore...', 'info');
            try {
                const docRef = await db.collection('_debug_test').add({
                    test: true,
                    timestamp: Date.now(),
                    authUser: user ? (user.email || user.uid) : 'none'
                });
                testDocId = docRef.id;
                log('writeResult', `✅ WRITE SUCCESSFUL! docId=${docRef.id}`, 'pass');
                log('writeResult', `✅ Your Firestore save SHOULD work. If it still fails on sifarish pages, the issue is script loading order.`, 'pass');
            } catch (e) {
                log('writeResult', `❌ WRITE FAILED: code=${e.code}, message=${e.message}`, 'fail');
                if (e.code === 'permission-denied') {
                    log('writeResult', `⚠️ PERMISSION DENIED — This is the exact error your sifarish pages show!`, 'warn');
                    log('writeResult', `⚠️ ROOT CAUSE: Your Firestore rules require "request.auth != null" but the user is ${user ? 'logged in as ' + (user.email || 'anonymous') + ' (but still denied — check rules)' : 'NOT LOGGED IN'}`, 'warn');
                }
            }
        }

        // Cleanup
        async function cleanupTest() {
            if (testDocId) {
                try {
                    await db.collection('_debug_test').doc(testDocId).delete();
                    log('writeResult', `🗑️ Test doc deleted`, 'info');
                } catch (e) {
                    log('writeResult', `❌ Delete failed: ${e.message}`, 'fail');
                }
            }
        }

        // Step 5: Full auto diagnosis
        async function fullDiagnosis() {
            clear('fullResult');
            log('fullResult', `<span class="step-num">=== FULL DIAGNOSIS START ===</span>`, 'info');

            // 1. Check current auth
            const user1 = firebase.auth().currentUser;
            log('fullResult', `<span class="step-num">[1]</span> Current auth: ${user1 ? '✅ ' + (user1.email || 'anonymous') : '❌ NULL'}`, user1 ? 'pass' : 'fail');

            // 2. Try anon
            let anonOk = false;
            try {
                const c = await firebase.auth().signInAnonymously();
                anonOk = true;
                log('fullResult', `<span class="step-num">[2]</span> Anonymous Auth: ✅ ENABLED (uid=${c.user.uid})`, 'pass');
            } catch (e) {
                log('fullResult', `<span class="step-num">[2]</span> Anonymous Auth: ❌ DISABLED (${e.code})`, 'fail');
            }

            // 3. Try write with current auth
            const user2 = firebase.auth().currentUser;
            let writeOk = false;
            try {
                const ref = await db.collection('_debug_test').add({ test: true, ts: Date.now() });
                writeOk = true;
                log('fullResult', `<span class="step-num">[3]</span> Firestore write (as ${user2 ? user2.email || 'anonymous' : 'none'}): ✅ SUCCESS`, 'pass');
                await db.collection('_debug_test').doc(ref.id).delete();
            } catch (e) {
                log('fullResult', `<span class="step-num">[3]</span> Firestore write: ❌ FAILED (${e.code})`, 'fail');
            }

            // 4. Sign out and try email credentials
            await firebase.auth().signOut();
            log('fullResult', `<span class="step-num">[4]</span> Signed out. Testing email credentials...`, 'info');

            const creds = [
                { e: 'ward1@gauradaha.gov.np', p: 'wada1' },
                { e: 'ward1@gauradaha.gov.np', p: 'ward1' },
                { e: 'admin@gauradaha.gov.np', p: 'admin' },
                { e: 'gauradaha.ward1@gmail.com', p: 'ward1wada1' }
            ];

            let workingCred = null;
            for (const c of creds) {
                try {
                    await firebase.auth().signInWithEmailAndPassword(c.e, c.p);
                    workingCred = c;
                    log('fullResult', `<span class="step-num">[4]</span> ✅ Credential works: ${c.e} / ${c.p}`, 'pass');
                    break;
                } catch (e) {
                    log('fullResult', `<span class="step-num">[4]</span> ❌ ${c.e} / ${c.p} → ${e.code}`, 'fail');
                }
            }

            // 5. Summary
            log('fullResult', `\n<span class="step-num">=== DIAGNOSIS SUMMARY ===</span>`, 'info');
            
            if (writeOk) {
                log('fullResult', `✅ Firestore writes work when authenticated. Your issue might be a timing/race condition.`, 'pass');
            }
            
            if (!anonOk && !workingCred) {
                log('fullResult', `\n🔴 ROOT CAUSE FOUND: Neither Anonymous Auth nor any email credentials work!`, 'fail');
                log('fullResult', `\n🔧 FIX OPTION 1 (EASIEST): Go to Firebase Console → Authentication → Sign-in method → Anonymous → ENABLE`, 'warn');
                log('fullResult', `🔧 FIX OPTION 2: Go to Firebase Console → Authentication → Users → Add User → email: ward1@gauradaha.gov.np, password: wada1`, 'warn');
                log('fullResult', `\n📌 Firebase Console URL: https://console.firebase.google.com/project/gauradaha-ward1/authentication/users`, 'info');
            } else if (anonOk) {
                log('fullResult', `✅ Anonymous Auth is enabled — writes should work via anonymous fallback`, 'pass');
            } else if (workingCred) {
                log('fullResult', `✅ Credential ${workingCred.e} works — writes should work via credential fallback`, 'pass');
            }
        }
    </script>
</body>
</html>
